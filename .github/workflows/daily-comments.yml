name: Daily Comment Automation

'on':
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automation
        run: python src/main.py
